name: Hugo
on: [pull_request]

jobs:
  build:
    name: Build authored pages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.126.1"

      - name: Build authored pages
        run: hugo --baseURL / --destination "${{ runner.temp }}/avd-preview"

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: avd-preview
          path: ${{ runner.temp }}/avd-preview
